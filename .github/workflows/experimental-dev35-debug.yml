name: Experimental dev.35 DEBUG build
# Retry after regression fixes.

on:
  push:
    branches: [testing/dev35-debug-build]
    paths:
      - '.github/workflows/experimental-dev35-debug.yml'
      - '.github/scripts/run_host_checks.py'
      - 'SPRX/tests/**'
      - 'SPRX/t7_maps.cpp'
      - 'Lua/ui_scripts/mods.lua'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install reviewed build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 lua5.1
      - name: Run host source regressions
        env:
          BO3_LUA_RUNNER: /usr/bin/lua5.1
        run: |
          python3 .github/scripts/run_host_checks.py
          python3 tools/console_diagnostics/test_console_logs.py
          python3 tools/test_project_session.py
      - name: Compile and verify native DEBUG candidate
        run: python3 .github/scripts/build_sprx.py --configuration Debug
      - name: Assemble complete console bundle from reviewed dev.26 companion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/candidate build/baseline
          gh release download v4-26 --repo "${{ github.repository }}" --pattern Console.zip --dir build/baseline
          echo "cfaba8ff0067e56fc3b7d5af70460712e4d31c08b28472d9213031fb795aa043  build/baseline/Console.zip" | sha256sum -c -
          cp build/openorbis/BO3-Customs.sprx build/candidate/BO3-Customs-v4.00.1-dev.35-DEBUG.sprx
          cp build/openorbis/target-validation.json build/candidate/target-validation.json
          git rev-parse HEAD > build/candidate/SOURCE_COMMIT.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path(".")
          source = root / "build/baseline/Console.zip"
          target = root / "build/candidate/Console.zip"
          sprx = (root / "build/candidate/BO3-Customs-v4.00.1-dev.35-DEBUG.sprx").read_bytes()
          report = json.loads((root / "build/candidate/target-validation.json").read_text())
          assert report["sprx_sha256"] == hashlib.sha256(sprx).hexdigest(), "SPRX validation mismatch"
          updates = {}
          for name in ("mods.lua", "mapselect.lua"):
              path = root / "Lua/ui_scripts" / name
              updates["BO3-Customs/ui_scripts/" + name] = path.read_bytes()
          with zipfile.ZipFile(source) as original:
              entries = [entry for entry in original.infolist() if not entry.is_dir()]
              names = [entry.filename.replace("\\", "/") for entry in entries]
              assert len(names) == len(set(n.casefold() for n in names)), "Duplicate console files"
              assert all(n.startswith("BO3-Customs/") and ".." not in pathlib.PurePosixPath(n).parts for n in names), "Unexpected console layout"
              assert set(updates).issubset(names), "Missing editable Lua in baseline"
              native = [n for n in names if n.endswith(".sprx")]
              assert len(native) == 1 and native[0].startswith("BO3-Customs/") and pathlib.PurePosixPath(native[0]).name.lower().startswith("bo3-customs"), "Unexpected native layout: " + repr(native)
              print("Replacing baseline SPRX at:", native[0])
              compiled = [n for n in names if n.startswith("BO3-Customs/lui/") and n.endswith(".lua")]
              assert len(compiled) == 39, "Compiled LUI inventory mismatch"
              editable = [n for n in names if n.startswith("BO3-Customs/ui_scripts/") and n.endswith(".lua")]
              assert len(editable) == 7, "Editable Lua inventory mismatch"
              updates[native[0]] = sprx
              with zipfile.ZipFile(target, "w", compression=zipfile.ZIP_DEFLATED) as output:
                  for entry in entries:
                      name = entry.filename.replace("\\", "/")
                      output.writestr(name, updates.get(name, original.read(entry)))
          with zipfile.ZipFile(target) as check:
              assert check.testzip() is None, "Console.zip CRC failure"
              assert check.read(native[0]) == sprx, "ZIP SPRX differs from standalone"
              for name, data in updates.items():
                  assert check.read(name) == data, "Console.zip missing updated " + name
              assert len([n for n in check.namelist() if n.startswith("BO3-Customs/lui/") and n.endswith(".lua")]) == 39
          print("PASS: complete Console.zip, 39 compiled LUI, seven editable scripts, current mods/mapselect and identical DEBUG SPRX")
          PY
          (cd build/candidate && sha256sum BO3-Customs-v4.00.1-dev.35-DEBUG.sprx Console.zip target-validation.json SOURCE_COMMIT.txt > SHA256SUMS.txt)
      - name: Preserve verified candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: bo3-customs-dev35-debug-experimental
          path: build/candidate/
          if-no-files-found: error
      - name: Publish explicitly experimental GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > build/candidate/RELEASE_NOTES.md <<'EOF'
          ## BO3-Customs v4.00.1 dev.35 DEBUG — EXPERIMENTAL

          This is an unofficial community experimental test build, not an official Joker release. **Not console-validated or stable.** Back up the previous SPRX and console files before installing. Crashes and regressions remain possible.

          ### Update your console files first
          Close BO3. Download `Console.zip` from this release and merge its `BO3-Customs/lui/` and `BO3-Customs/ui_scripts/` folders into `/data/BO3-Customs/`. Install `BO3-Customs-v4.00.1-dev.35-DEBUG.sprx` in your loader's plugin directory, enable only one Customs SPRX, then fully restart BO3. The ZIP also contains an identical SPRX copy in its original companion-package location; do not load both. The ZIP retains all 39 compiled LUI files and seven editable scripts, with updated mods.lua and mapselect.lua.

          ### Changes under test
          - Lua mod selection recovery and stale callback handling
          - Main-menu-only MODS entry and empty-catalog menu access
          - Native malformed mod folder name validation
          - Lua retention, unload/recovery and diagnostics improvements
          - GPU texture readiness timeout guard (not a confirmed GPU-stall fix)

          ### Please test
          - Fresh startup on PS4/PS5 BO3 1.33
          - Main menu MODS button with and without installed mods
          - Selecting one and multiple mods; disabling and re-enabling mods
          - Repeated menu entry, gameplay transitions, map switching, and mod-off recovery
          - Zombies/Multiplayer gameplay, GPU stalls, performance and crash behavior
          - Host/client mod activation and transfer if applicable

          Report console model, content names, steps to reproduce, and logs from `/data/BO3-Customs/log.txt` and `/data/BO3-Customs/crash-errors.log` (when present). Do not post private console identifiers.

          The native active stack still has fixed capacity; do not interpret Lua menu acceptance as proof of native activation.
          EOF
          TAG="dev35-debug-experimental-${GITHUB_SHA:0:12}"
          gh release create "$TAG" \
            build/candidate/BO3-Customs-v4.00.1-dev.35-DEBUG.sprx \
            build/candidate/Console.zip \
            build/candidate/target-validation.json \
            build/candidate/SHA256SUMS.txt \
            build/candidate/SOURCE_COMMIT.txt \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "BO3-Customs v4.00.1 - DEBUG dev.35 (Experimental)" \
            --notes-file build/candidate/RELEASE_NOTES.md --prerelease --latest=false

      - name: Announce experimental candidate to Discord if webhook configured
        # Notification delivery is external; never invalidate a verified SPRX release.
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/dev35-debug-experimental-${{ github.sha }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No DISCORD_WEBHOOK_URL secret configured; release published but Discord announcement skipped."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          from urllib.parse import urlsplit
          from datetime import datetime, timezone

          webhook = os.environ["DISCORD_WEBHOOK_URL"].strip()
          parts = urlsplit(webhook)
          if parts.scheme != "https" or parts.hostname not in ("discord.com", "discordapp.com") or not parts.path.startswith("/api/webhooks/"):
              print("::warning::DISCORD_WEBHOOK_URL must be a Discord HTTPS webhook URL; announcement skipped.")
              raise SystemExit(0)
          release_url = os.environ["RELEASE_URL"].rsplit("-", 1)[0] + "-" + os.environ["GITHUB_SHA"][:12]
          message = (
              "🧪 **BO3-Customs dev.35 DEBUG — EXPERIMENTAL TESTING ONLY**\\n"
              "**NO STABILITY CLAIMS.** Crashes, freezes, and regressions are possible. "
              "This is not a stable release. Back up your previous SPRX and console files.\\n\\n"
              "**Included:** Matching Console.zip with updated Lua and the standalone DEBUG SPRX.\\n"
              "**Test:** PS4/PS5 startup, MODS on/off, repeated reloads, Zombies/Multiplayer, maps, GPU stalls and performance.\\n"
              "**Download and full notes:** " + release_url
          )
          data = json.dumps({"content": message, "allowed_mentions": {"parse": []}}).encode("utf-8")
          for attempt in range(3):
              req = urllib.request.Request(webhook, data=data, method="POST", headers={
                  "Content-Type": "application/json; charset=utf-8",
                  "Accept": "application/json",
                  "User-Agent": "BO3-Customs-ReleaseBot/1.0 (GitHub Actions)"
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      print("Discord announcement delivered (HTTP", response.status, ")")
                  break
              except urllib.error.HTTPError as error:
                  retryable = error.code in (429, 500, 502, 503, 504)
                  if retryable and attempt < 2:
                      retry_after = error.headers.get("Retry-After", "2")
                      try:
                          delay = min(15, max(1, float(retry_after)))
                      except ValueError:
                          delay = 2
                      print(f"::warning::Discord returned HTTP {error.code}; retrying in {delay:g}s")
                      time.sleep(delay)
                      continue
                  print(f"::warning::Discord rejected announcement (HTTP {error.code}). Check webhook URL, channel permissions or Discord network filtering. Release remains published.")
                  break
              except urllib.error.URLError:
                  print("::warning::Discord webhook network failure; release remains published.")
                  break
          PY
