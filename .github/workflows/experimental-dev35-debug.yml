name: Experimental dev.35 DEBUG build
# Native build, release and announcement require an explicit manual dispatch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install reviewed build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 lua5.1
      - name: Run host source regressions
        env:
          BO3_LUA_RUNNER: /usr/bin/lua5.1
        run: |
          python3 .github/scripts/run_host_checks.py
          python3 tools/console_diagnostics/test_console_logs.py
          python3 tools/test_project_session.py
      - name: Compile and verify native DEBUG candidate
        run: python3 .github/scripts/build_sprx.py --configuration Debug
      - name: Assemble complete console bundle from reviewed dev.26 companion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/candidate build/baseline
          gh release download v4-26 --repo "${{ github.repository }}" --pattern Console.zip --dir build/baseline
          echo "cfaba8ff0067e56fc3b7d5af70460712e4d31c08b28472d9213031fb795aa043  build/baseline/Console.zip" | sha256sum -c -
          cp build/openorbis/BO3-Customs.sprx build/candidate/BO3-Customs-v4.00.1-dev.35-DEBUG.sprx
          cp build/openorbis/target-validation.json build/candidate/target-validation.json
          git rev-parse HEAD > build/candidate/SOURCE_COMMIT.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path(".")
          source = root / "build/baseline/Console.zip"
          target = root / "build/candidate/Console.zip"
          sprx = (root / "build/candidate/BO3-Customs-v4.00.1-dev.35-DEBUG.sprx").read_bytes()
          report = json.loads((root / "build/candidate/target-validation.json").read_text())
          assert report["sprx_sha256"] == hashlib.sha256(sprx).hexdigest(), "SPRX validation mismatch"
          updates = {}
          for name in ("mods.lua", "mapselect.lua"):
              path = root / "Lua/ui_scripts" / name
              updates["BO3-Customs/ui_scripts/" + name] = path.read_bytes()
          with zipfile.ZipFile(source) as original:
              entries = [entry for entry in original.infolist() if not entry.is_dir()]
              names = [entry.filename.replace("\\", "/") for entry in entries]
              assert len(names) == len(set(n.casefold() for n in names)), "Duplicate console files"
              assert all(n.startswith("BO3-Customs/") and ".." not in pathlib.PurePosixPath(n).parts for n in names), "Unexpected console layout"
              assert set(updates).issubset(names), "Missing editable Lua in baseline"
              native = [n for n in names if n.lower().endswith(".sprx")]
              assert len(native) == 1 and native[0].startswith("BO3-Customs/") and pathlib.PurePosixPath(native[0]).name.lower().startswith("bo3-customs"), "Unexpected baseline native layout: " + repr(native)
              new_native = "BO3-Customs/BO3-Customs-v4.00.1-dev.35-DEBUG.sprx"
              assert new_native not in names or new_native == native[0], "New SPRX filename already exists in baseline"
              print("Replacing obsolete baseline SPRX:", native[0], "with", new_native)
              compiled = [n for n in names if n.startswith("BO3-Customs/lui/") and n.endswith(".lua")]
              assert len(compiled) == 39, "Compiled LUI inventory mismatch"
              editable = [n for n in names if n.startswith("BO3-Customs/ui_scripts/") and n.endswith(".lua")]
              assert len(editable) == 7, "Editable Lua inventory mismatch"
              original_compiled = {name: original.read(name) for name in compiled}
              with zipfile.ZipFile(target, "w", compression=zipfile.ZIP_DEFLATED) as output:
                  for entry in entries:
                      name = entry.filename.replace("\\", "/")
                      if name == native[0]:
                          continue  # Never ship the old dev.26 filename or binary.
                      output.writestr(name, updates.get(name, original.read(entry)))
                  output.writestr(new_native, sprx)
          with zipfile.ZipFile(target) as check:
              assert check.testzip() is None, "Console.zip CRC failure"
              packaged_native = [n for n in check.namelist() if n.lower().endswith(".sprx")]
              assert packaged_native == [new_native], "Console.zip must contain exactly the current dev.35 SPRX: " + repr(packaged_native)
              assert check.read(new_native) == sprx, "ZIP SPRX differs from standalone"
              assert hashlib.sha256(check.read(new_native)).hexdigest() == report["sprx_sha256"], "Packaged SPRX hash differs from validated build"
              for name, data in updates.items():
                  assert check.read(name) == data, "Console.zip missing updated " + name
              compiled_in_zip = sorted(n for n in check.namelist() if n.startswith("BO3-Customs/lui/") and n.endswith(".lua"))
              assert compiled_in_zip == sorted(compiled), "Compiled LUI file inventory changed"
              for name in compiled:
                  assert check.read(name) == original_compiled[name], "Compiled LUI bytecode changed unexpectedly: " + name
              editable_in_zip = sorted(n for n in check.namelist() if n.startswith("BO3-Customs/ui_scripts/") and n.endswith(".lua"))
              assert editable_in_zip == sorted(editable), "Editable Lua file inventory changed"
              print("Verified all 39 unchanged compiled LUI chunks and all seven editable Lua scripts")
          print("PASS: complete Console.zip, 39 byte-identical baseline LUI chunks, seven editable scripts, current mods/mapselect and identical DEBUG SPRX")
          PY
          (cd build/candidate && sha256sum BO3-Customs-v4.00.1-dev.35-DEBUG.sprx Console.zip target-validation.json SOURCE_COMMIT.txt > SHA256SUMS.txt)
      - name: Preserve verified candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: bo3-customs-dev35-debug-experimental
          path: build/candidate/
          if-no-files-found: error
      - name: Publish explicitly experimental GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dev35-debug-experimental-${GITHUB_SHA:0:12}"
          RELEASE_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          cat > build/candidate/RELEASE_NOTES.md <<EOF
          ## Update your console files first

          Close BO3. Download [Console.zip]($RELEASE_BASE/Console.zip) and merge its \`BO3-Customs/lui/\` and \`BO3-Customs/ui_scripts/\` folders into \`/data/BO3-Customs/\`. Install \`BO3-Customs-v4.00.1-dev.35-DEBUG.sprx\` in your loader's configured plugin directory, enable only one Customs plugin, then fully restart BO3.

          The ZIP contains the existing \`BO3-Customs\` companion layout with both Lua folders and the newly named \`BO3-Customs-v4.00.1-dev.35-DEBUG.sprx\` matching the [standalone download]($RELEASE_BASE/BO3-Customs-v4.00.1-dev.35-DEBUG.sprx). All 39 precompiled LUI files and seven editable UI scripts are retained, including updated \`mods.lua\` and \`mapselect.lua\`. Back up your previously working console files and SPRX before testing.

          ## What's new

          **dev.35 DEBUG** is an unofficial community **experimental** stabilization candidate based on [Joker's v4.00 release](https://github.com/ItsJokerZz/PS4-BO3-Customs/releases/tag/v4.00). It is not the original Joker distribution or an official replacement. It is **not PS4/PS5 console-validated**; crashes, freezes and performance regressions remain possible.

          **Changes since v4-26:**

          - **Mod selection recovery:** improves stale callback handling and restores Mods UI state when disabling or re-enabling mods. Safe mod-off recovery remains a required console test, not a confirmed fix.
          - **MODS menu placement:** limits the entry to the main menu and permits opening the Mods UI with an empty catalog.
          - **Native mod-name validation:** rejects malformed mod folder names before native processing.
          - **Lua lifetime and unload handling:** improves retention, unload/recovery and diagnostic paths. Repeated enable/disable and returning to a non-modded state still require console verification.
          - **GPU/streaming diagnostics:** adds a texture-readiness timeout guard and related checks. This does **not** establish that GPU synchronization stalls or freezes have been fixed.
          - **Release packaging:** provides the matching full \`Console.zip\` companion bundle and standalone DEBUG SPRX, with checksum and source-build evidence.

          **Compared with Joker v4.00:** the previously published dev.21–dev.26 stabilization work remains, including safer companion-file reads, external-drive Lua support, map-menu recovery, clean-startup selection handling, protected asset routing, and GPU/streaming diagnostics. Those are retained improvements, not newly introduced dev.35 changes.

          **Status:** native DEBUG compilation, container checks and focused host regressions are required to pass before this prerelease is published. PS4/PS5 console behavior, GPU stalls, mod-off rollback, Zombies/Multiplayer maps and host/client activation still need real-console testing. No hardware stability claim is made. The native active mod stack has fixed capacity; a checked UI row alone does not establish activation.

          **Downloads:** [Console.zip]($RELEASE_BASE/Console.zip) | [SPRX]($RELEASE_BASE/BO3-Customs-v4.00.1-dev.35-DEBUG.sprx)

          ## Found a problem?

          [Report it on GitHub](https://github.com/${GITHUB_REPOSITORY}/issues). Include PS4 or PS5, the SPRX version, map/version, enabled mods and their order, storage location and exact reproduction steps. Attach \`/data/BO3-Customs/log.txt\` before restarting BO3 (the log resets on launch) and \`/data/BO3-Customs/crash-errors.log\` if present. For joining failures, include host and client logs and whether matching mods were enabled manually. Do not publish private console identifiers.
          EOF
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists for this exact commit; refreshing notes and assets."
            gh release upload "$TAG" \
              build/candidate/BO3-Customs-v4.00.1-dev.35-DEBUG.sprx \
              build/candidate/Console.zip \
              build/candidate/target-validation.json \
              build/candidate/SHA256SUMS.txt \
              build/candidate/SOURCE_COMMIT.txt \
              --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" --repo "${{ github.repository }}" \
              --title "BO3-Customs v4-35 - DEBUG dev.35" \
              --notes-file build/candidate/RELEASE_NOTES.md --prerelease --latest=false
          else
            gh release create "$TAG" \
              build/candidate/BO3-Customs-v4.00.1-dev.35-DEBUG.sprx \
              build/candidate/Console.zip \
              build/candidate/target-validation.json \
              build/candidate/SHA256SUMS.txt \
              build/candidate/SOURCE_COMMIT.txt \
              --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "BO3-Customs v4-35 - DEBUG dev.35" \
              --notes-file build/candidate/RELEASE_NOTES.md --prerelease --latest=false
          fi

      - name: Announce the published release in Discord
        # This workflow creates releases with GITHUB_TOKEN, which does not
        # trigger a second release workflow. Reuse the shared release notifier.
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No DISCORD_WEBHOOK_URL secret configured; release announcement skipped."
            exit 0
          fi
          TAG="dev35-debug-experimental-${GITHUB_SHA:0:12}"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          python3 .github/scripts/discord_release_webhook.py "$RUNNER_TEMP/release.json"
